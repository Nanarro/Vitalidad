name: Build Vital iOS (AUv3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Clone Vital
        run: |
          git clone --depth 1 https://github.com/mtytel/vital.git
          cd vital/plugin/builds/iOS
          ls
          xcodebuild -list -project Vial.xcodeproj || true

      - name: Patch project for modern Xcode
        run: |
          cd vital/plugin/builds/iOS
          # -mtune=cortex-a53 is not valid for Apple arm64
          sed -i '' 's/-mtune=cortex-a53//g' Vial.xcodeproj/project.pbxproj
          # Old deployment target is rejected by modern Xcode
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 9.3;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' Vial.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: |
          cd vital/plugin/builds/iOS
          set -o pipefail
          xcodebuild build \
            -project Vial.xcodeproj \
            -target "Vial - Standalone Plugin" \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee ../../../../build.log

      - name: Package .ipa
        run: |
          cd vital/plugin/builds/iOS
          APP=$(find . -name "*.app" -path "*Release-iphoneos*" | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -name "*.appex"
          zip -qry ../../../../Vital-unsigned.ipa Payload

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Vital-unsigned-ipa
          path: Vital-unsigned.ipa

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
